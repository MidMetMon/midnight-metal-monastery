<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Midnight Metal Monastery</title>

        <link href="https://fonts.googleapis.com/css2?family=Special+Elite&display=swap" rel="stylesheet">

    <style>
        *
        a { color: #ffffff; text-decoration: none; }
        a:hover { text-decoration: underline;
        text-decoration-thickness: 3px;
        }
        {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #000;
            color: #fff;
            overflow: hidden;
        }

        .container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Full background image - no border */
        .background {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('/home/sudovillan/Documents/midnight-metal-monastery-site/images/The_Catholic_encyclopedia_(Volume_9);_an_international_work_of_reference_on_the_constitution,_doctrine,_discipline_and_history_of_the_Catholic_Church_(1907)_(14774838801).webp');
            background-size: cover;
            background-position: center;
            z-index: 1;
        }

        /* Centered text content - black bars behind text */
        .content {
            position: relative;
            z-index: 3;
            text-align: center;
            max-width: 800px;
        }

        h1 {
            font-family: 'Special Elite', serif;
            font-size: 3.5rem;
            font-weight: 900;
            letter-spacing: 0.15em;
            margin-bottom: 20px;
            text-transform: uppercase;
            line-height: 1.3;
            background: #000;
            padding: 20px 40px;
            display: inline-block;
        }

        .subtitle {
            font-family: 'Special Elite', serif;
            font-size: 1.3rem;
            font-weight: bold;
            letter-spacing: 0.05em;
            line-height: 1.8;
            text-transform: uppercase;
        }

        .subtitle p {
            background: #000;
            padding: 10px 40px;
            margin: 8px 0;
            display: inline-block;
        }

        /* Large logo in lower page */
        .logo-bottom {
            position: absolute;
            bottom: 40px;
            right: 40px;
            z-index: 3;
            font-size: 1.2rem;
            font-weight: bold;
            letter-spacing: 0.1em;
            background: #000;
            padding: 10px 15px;
            border: 2px solid #fff;
        }

        /* Tablet */
        @media (max-width: 1024px) {
            h1 {
                font-size: 2.8rem;
                padding: 18px 35px;
            }

            .subtitle {
                font-size: 1.1rem;
            }

            .subtitle p {
                padding: 8px 30px;
            }

            .icons-top-left {
                top: 30px;
                left: 30px;
                gap: 12px;
            }

            .icon {
                width: 28px;
                height: 28px;
                font-size: 11px;
            }

            .logo-bottom {
                bottom: 30px;
                right: 30px;
                font-size: 1rem;
                padding: 8px 12px;
            }
        }

        /* Mobile landscape */
        @media (max-width: 768px) and (orientation: landscape) {
            h1 {
                font-size: 1.8rem;
                margin-bottom: 10px;
                padding: 12px 25px;
            }

            .subtitle {
                font-size: 0.85rem;
            }

            .subtitle p {
                padding: 6px 20px;
                margin: 5px 0;
            }

            .icons-top-left {
                top: 20px;
                left: 20px;
                gap: 10px;
            }

            .icon {
                width: 24px;
                height: 24px;
                font-size: 10px;
            }

            .logo-bottom {
                bottom: 20px;
                right: 20px;
                font-size: 0.9rem;
                padding: 6px 10px;
            }
        }

        /* Mobile portrait */
        @media (max-width: 480px) {
            h1 {
                font-size: 1.8rem;
                letter-spacing: 0.1em;
                margin-bottom: 15px;
                padding: 15px 25px;
            }

            .subtitle {
                font-size: 0.9rem;
                letter-spacing: 0.02em;
            }

            .subtitle p {
                padding: 8px 20px;
                margin: 6px 0;
            }

            .icons-top-left {
                top: 20px;
                left: 20px;
                gap: 10px;
            }

            .icon {
                width: 24px;
                height: 24px;
                font-size: 10px;
            }

            .logo-bottom {
                bottom: 20px;
                right: 20px;
                font-size: 0.85rem;
                padding: 6px 10px;
            }
        }

        /* Very small phones */
        @media (max-width: 360px) {
            h1 {
                font-size: 1.4rem;
                margin-bottom: 12px;
                padding: 12px 18px;
            }

            .subtitle {
                font-size: 0.8rem;
            }

            .subtitle p {
                padding: 6px 15px;
                margin: 5px 0;
            }

            .icons-top-left {
                top: 15px;
                left: 15px;
                gap: 8px;
            }

            .icon {
                width: 20px;
                height: 20px;
                font-size: 9px;
            }

            .logo-bottom {
                bottom: 15px;
                right: 15px;
                font-size: 0.75rem;
                padding: 5px 8px;
            }
            .player-section h2 {
        font-family: 'Special Elite', serif;  /* Add this */
        color: #fff;
        background: #000;
        padding: 20px;
        margin-bottom: 10px;
        font-size: 2rem;
    }

    .player-section p {
        font-family: 'Special Elite', serif;  /* Add this */
        color: #fff;
        background: #000;
        padding: 10px 20px;
        margin-bottom: 20px;
    }
    </style>
</head>
<body>
    <div class="container">
        <div class="background"></div>

        <!-- Small icons top left -->
        <div class="icons-top-left">
            <div class="icon">✦</div>
            <div class="icon">◆</div>
            <div class="icon">★</div>
        </div>

        <!-- Center content - black bars behind text -->
        <div class="content">

            <div class="subtitle">
                <p>Contact:</p>
                <p><a href="mailto:contact@midnightmetalmonastery.com">Ring the monastery bells.</a> Send us your prayer requests, music recommendations, and thoughts—whatever dwells in your spirit.</p>
                <p><a href="https://www.facebook.com/people/Midnight-Metal-Monastery/100063629198333/" target="_blank">Find us on Facebook</a>. Join or growing congregation.</p>
            </div>

</body>
</html>
