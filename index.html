<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Midnight Metal Monastery</title>

    <link href="https://fonts.googleapis.com/css2?family=Special+Elite&display=swap" rel="stylesheet">
    <style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    a { color: #ffffff; text-decoration: none; }
    a:hover {
        text-decoration: underline;
        text-decoration-thickness: 3px;
    }

    body {
        font-family: Arial, sans-serif;
        background: #000;
        color: #fff;
        overflow: hidden;
    }

    .container {
        position: relative;
        width: 100vw;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .background {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-image: url('https://raw.githubusercontent.com/MidMetMon/midnight-metal-monastery/fbbfa54cd344f1b5de62e53fdd4fb626ae86232a/images/The_Catholic_encyclopedia_(Volume_9)%3B_an_international_work_of_reference_on_the_constitution%2C_doctrine%2C_discipline_and_history_of_the_Catholic_Church_(1907)_(14774838801).webp');
        background-size: cover;
        background-position: center;
        z-index: 1;
    }

    .content {
        position: relative;
        z-index: 3;
        text-align: center;
        max-width: 800px;
    }

    h1 {
        font-family: 'Special Elite', serif;
        font-size: 3.5rem;
        font-weight: 900;
        letter-spacing: 0.15em;
        margin-bottom: 20px;
        text-transform: uppercase;
        line-height: 1.3;
        background: #000;
        padding: 20px 40px;
        display: inline-block;
    }

    .subtitle {
        font-family: 'Special Elite', serif;
        font-size: 1.3rem;
        font-weight: bold;
        letter-spacing: 0.05em;
        line-height: 1.8;
        text-transform: uppercase;
    }

    .subtitle p {
        background: #000;
        padding: 10px 40px;
        margin: 8px 0;
        display: inline-block;
    }

    .player-wrapper {
        max-width: 600px;
        margin: 20px auto;
        background: #000;
        padding: 20px;
        border-radius: 8px;
    }

    #episode-player {
        border-radius: 4px;
    }

    #episode-title {
        margin-top: 10px;
        font-size: 0.9rem;
        color: #ccc;
    }

    .error-message {
        color: #ff9999;
        font-size: 0.9rem;
        padding: 10px;
        margin-top: 10px;
    }
    </style>
</head>
<body>
    <div class="container">
        <div class="background"></div>

        <div class="content">
            <h1>MIDNIGHT METAL MONASTERY</h1>
            <div class="subtitle">
                <p>We are the Warrior Monks of Christian Rock Radio—slamming the jams that worship the Lamb, servants of the Almighty God.</p>
            </div>

            <div class="subtitle">
                <p><a href="https://archive.org/details/midnight-metal-monastery?sort=-date" target="_blank">All Episodes</a> &#8224; <a href="https://midmetmon.github.io/midnight-metal-monastery/subscribe.html">Subscribe</a> &#8224; <a href="https://midmetmon.github.io/midnight-metal-monastery/about.html">About</a> &#8224; <a href="mailto:contact@midnightmetalmonastery.com">Contact</a> &#8224; <a href="https://midmetmon.github.io/midnight-metal-monastery/support.html">Support</a></p>
            </div>

            <div class="subtitle">
                <p>Latest Episode:</p>
            </div>

            <div class="player-wrapper">
                <audio id="episode-player" controls style="width: 100%; border-radius: 4px;">
                    Your browser does not support the audio element.
                </audio>
                <p id="episode-title"></p>
                <p id="error-message" class="error-message"></p>
            </div>
        </div>
    </div>

    <script>
<script>
async function loadLatestEpisode() {
    const errorEl = document.getElementById('error-message');
    const debugEl = document.getElementById('debug-info');
    
    try {
        console.log('Attempting to fetch RSS feed...');
        
        // Try different CORS proxies in order
        const proxies = [
            'https://corsproxy.io/?',
            'https://api.allorigins.win/raw?url='
        ];
        
        const rssUrl = 'https://raw.githubusercontent.com/MidMetMon/midnight-metal-monastery/main/podcast.rss';
        
        let rssText = null;
        let fetchUrl = '';
        
        for (const proxy of proxies) {
            try {
                fetchUrl = proxy + encodeURIComponent(rssUrl);
                console.log('Trying proxy:', proxy);
                console.log('Fetching from:', fetchUrl);
                
                const response = await fetch(fetchUrl, { timeout: 10000 });
                
                if (!response.ok) {
                    console.log('Proxy failed with status:', response.status);
                    continue;
                }
                
                rssText = await response.text();
                console.log('Successfully fetched with proxy:', proxy);
                break;
            } catch (proxyError) {
                console.log('Proxy error:', proxyError.message);
                continue;
            }
        }
        
        if (!rssText) {
            throw new Error('All proxies failed. RSS feed may be unreachable.');
        }
        
        debugEl.textContent = 'RSS fetched, parsing...';
        console.log('RSS content length:', rssText.length);

        const parser = new DOMParser();
        const xmlDoc = parser.parseFromString(rssText, 'application/xml');

        if (xmlDoc.getElementsByTagName('parsererror').length > 0) {
            throw new Error('Failed to parse RSS feed');
        }

        const items = xmlDoc.getElementsByTagName('item');
        console.log('Found items:', items.length);
        
        if (items.length === 0) {
            throw new Error('No episodes found in feed');
        }

        const latestItem = items[0];
        
        const titleElement = latestItem.getElementsByTagName('title')[0];
        const title = titleElement ? titleElement.textContent : 'Latest Episode';
        console.log('Episode title:', title);
        
        const enclosureElement = latestItem.getElementsByTagName('enclosure')[0];
        if (!enclosureElement) {
            throw new Error('No audio file found in latest episode');
        }

        const mp3Url = enclosureElement.getAttribute('url');
        console.log('MP3 URL:', mp3Url);
        debugEl.textContent = 'Audio URL: ' + mp3Url;
        
        if (!mp3Url) {
            throw new Error('Enclosure URL not found');
        }

        const player = document.getElementById('episode-player');
        player.src = mp3Url;
        
        document.getElementById('episode-title').textContent = title;
        errorEl.textContent = '';
        
        console.log('Successfully loaded:', title);
    } catch (error) {
        console.error('Error loading podcast:', error);
        errorEl.textContent = 'Error: ' + error.message;
        document.getElementById('episode-player').style.display = 'none';
    }
}

document.addEventListener('DOMContentLoaded', loadLatestEpisode);
</script>

    </script>
</body>
</html>
