<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Midnight Metal Monastery</title>

    <link href="https://fonts.googleapis.com/css2?family=Special+Elite&display=swap" rel="stylesheet">
    <style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    a { color: #ffffff; text-decoration: none; }
    a:hover {
        text-decoration: underline;
        text-decoration-thickness: 3px;
    }

    body {
        font-family: Arial, sans-serif;
        background: #000;
        color: #fff;
        overflow: hidden;
    }

    .container {
        position: relative;
        width: 100vw;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    /* Full background image - no border */
    .background {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-image: url('https://raw.githubusercontent.com/MidMetMon/midnight-metal-monastery/fbbfa54cd344f1b5de62e53fdd4fb626ae86232a/images/The_Catholic_encyclopedia_(Volume_9)%3B_an_international_work_of_reference_on_the_constitution%2C_doctrine%2C_discipline_and_history_of_the_Catholic_Church_(1907)_(14774838801).webp');
        background-size: cover;
        background-position: center;
        z-index: 1;
    }

    /* Centered text content - black bars behind text */
    .content {
        position: relative;
        z-index: 3;
        text-align: center;
        max-width: 800px;
    }

    h1 {
        font-family: 'Special Elite', serif;
        font-size: 3.5rem;
        font-weight: 900;
        letter-spacing: 0.15em;
        margin-bottom: 20px;
        text-transform: uppercase;
        line-height: 1.3;
        background: #000;
        padding: 20px 40px;
        display: inline-block;
    }

    .subtitle {
        font-family: 'Special Elite', serif;
        font-size: 1.3rem;
        font-weight: bold;
        letter-spacing: 0.05em;
        line-height: 1.8;
        text-transform: uppercase;
    }

    .subtitle p {
        background: #000;
        padding: 10px 40px;
        margin: 8px 0;
        display: inline-block;
    }

    .player-section h2 {
        font-family: 'Special Elite', serif;
        color: #fff;
        background: #000;
        padding: 20px;
        margin-bottom: 10px;
        font-size: 2rem;
    }

    .player-section p {
        font-family: 'Special Elite', serif;
        color: #fff;
        background: #000;
        padding: 10px 20px;
        margin-bottom: 20px;
    }

    /* Podcast player styling */
    #podcast-player {
        max-width: 600px;
        margin: 20px auto;
    }

.podcast-container {
    display: flex;
    flex-direction: column;
    gap: 0;
    margin: 0;
    padding: 0;
}

.podcast-container iframe {
    order: 2;
    display: block;
    margin: 0;
    padding: 0;
}

.podcast-info {
    order: 1;
    margin-bottom: 10px; /*!important;*/
    padding: 0 /*!important;*/
    font-size: 1rem;
    font-family: 'Special Elite', serif;
}

.podcast-info p {
    margin: 0 !important;
    color: #fff;
    background: #000;
    padding: 10px 40px;
    display: inline-block;
}

    /* Tablet */
    @media (max-width: 1024px) {
        h1 {
            font-size: 2.8rem;
            padding: 18px 35px;
        }

        .subtitle {
            font-size: 1.1rem;
        }

        .subtitle p {
            padding: 8px 30px;
        }
        
    }

    /* Mobile landscape */
    @media (max-width: 768px) and (orientation: landscape) {
        h1 {
            font-size: 1.8rem;
            margin-bottom: 10px;
            padding: 12px 25px;
        }

        .subtitle {
            font-size: 0.85rem;
        }

        .subtitle p {
            padding: 6px 20px;
            margin: 5px 0;
        }

    }

    /* Mobile portrait */
    @media (max-width: 480px) {
        h1 {
            font-size: 1.8rem;
            letter-spacing: 0.1em;
            margin-bottom: 15px;
            padding: 15px 25px;
        }

        .subtitle {
            font-size: 0.9rem;
            letter-spacing: 0.02em;
        }

        .subtitle p {
            padding: 8px 20px;
            margin: 6px 0;
        }


    }

    /* Very small phones */
    @media (max-width: 360px) {
        h1 {
            font-size: 1.4rem;
            margin-bottom: 12px;
            padding: 12px 18px;
        }

        .subtitle {
            font-size: 0.8rem;
        }

        .subtitle p {
            padding: 6px 15px;
            margin: 5px 0;
        }

    }
    </style>
</head>
<body>
    <div class="container">
        <div class="background"></div>

        <!-- Center content - black bars behind text -->
        <div class="content">
            <h1>MIDNIGHT METAL MONASTERY</h1>
            <div class="subtitle">
                <p>We are the Warrior Monks of Christian Rock Radio—slamming the jams that worship the Lamb, servants of the Almighty God.</p>
            </div>

            <div class="subtitle">
                <p><a href="https://archive.org/details/midnight-metal-monastery?sort=-date" target="_blank">All Episodes</a> &#8224; <a href="https://midmetmon.github.io/midnight-metal-monastery/subscribe.html">Subscribe</a> &#8224; <a href="https://midmetmon.github.io/midnight-metal-monastery/about.html">About</a> &#8224; <a href="mailto:contact@midnightmetalmonastery.com">Contact</a> &#8224; <a href="https://midmetmon.github.io/midnight-metal-monastery/support.html">Support</a></p>
            </div>

            <div class="subtitle">
                <p>Latest Episode:</p>
            </div>

            <!-- Archive.org embed -->
            <div id="podcast-player"></div>
        </div>
    </div>

    <script>
    async function loadLatestEpisode() {
      const collectionId = 'midnight-metal-monastery';
      const apiUrl = `https://archive.org/advancedsearch.php?q=collection:${collectionId}&fl=identifier,date,title&sort=date+desc&output=json&rows=1`;

      try {
        const response = await fetch(apiUrl);
        const data = await response.json();

        if (!data.response.docs || data.response.docs.length === 0) {
          document.getElementById('podcast-player').innerHTML =
            '<p>No episodes found in this collection.</p>';
          return;
        }

        const latestItem = data.response.docs[0];
        const itemId = latestItem.identifier;
        const title = latestItem.title || itemId;
        const date = latestItem.date || 'Unknown date';

        const embedHTML = `
          <div class="podcast-container">
            <iframe src="https://archive.org/embed/${itemId}"
              width="560" height="384" frameborder="0"
              webkitallowfullscreen="true"
              mozallowfullscreen="true" allowfullscreen>
            </iframe>
            <div class="podcast-info">
              <p><strong>${title}</strong><br><em>Published: ${date}</em></p>
            </div>
          </div>
        `;

        document.getElementById('podcast-player').innerHTML = embedHTML;

      } catch (error) {
        console.error('Error loading podcast:', error);
      }
    }

    loadLatestEpisode();
    </script>
</body>
</html>
