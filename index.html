<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Meta tags for character encoding and responsive design -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Midnight Metal Monastery</title>

    <!-- Import custom font for elegant typography -->
    <link href="https://fonts.googleapis.com/css2?family=Special+Elite&display=swap" rel="stylesheet">

    <style>
    /* ===== GLOBAL RESET ===== */
    /* Reset default margins, padding, and set border-box sizing for all elements */
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    /* ===== LINK STYLING ===== */
    /* Style all links with white color and remove default underline */
    a {
        color: #ffffff;
        text-decoration: none;
    }

    /* Add underline on hover for better user interaction feedback */
    a:hover {
        text-decoration: underline;
        text-decoration-thickness: 3px;
    }

    /* ===== BODY STYLING ===== */
    /* Set base font, dark background, and prevent page scrolling */
    body {
        font-family: Arial, sans-serif;
        background: #000;
        color: #fff;
        overflow: hidden;
    }

    /* ===== MAIN CONTAINER ===== */
    /* Full viewport container that centers content using flexbox */
    .container {
        position: relative;
        width: 100vw;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    /* ===== BACKGROUND IMAGE ===== */
    /* Full-screen background image that covers the entire viewport */
    .background {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-image: url('https://raw.githubusercontent.com/MidMetMon/midnight-metal-monastery/fbbfa54cd344f1b5de62e53fdd4fb626ae86232a/images/The_Catholic_encyclopedia_(Volume_9)%3B_an_international_work_of_reference_on_the_constitution%2C_doctrine%2C_discipline_and_history_of_the_Catholic_Church_(1907)_(14774838801).webp');
        background-size: cover;
        background-position: center;
        z-index: 1;
    }

    /* ===== MAIN CONTENT AREA ===== */
    /* Container for all text and player content, positioned above background */
    .content {
        position: relative;
        z-index: 3;
        text-align: center;
        max-width: 800px;
    }

    /* ===== PAGE TITLE ===== */
    /* Main heading with custom font, large size, and black background */
    h1 {
        font-family: 'Special Elite', serif;
        font-size: 3.5rem;
        font-weight: 900;
        letter-spacing: 0.15em;
        margin-bottom: 20px;
        text-transform: uppercase;
        line-height: 1.3;
        background: #000;
        padding: 20px 40px;
        display: inline-block;
    }

    /* ===== SUBTITLE STYLING ===== */
    /* Container for subtitle sections with custom typography */
    .subtitle {
        font-family: 'Special Elite', serif;
        font-size: 1.3rem;
        font-weight: bold;
        letter-spacing: 0.05em;
        line-height: 1.8;
        text-transform: uppercase;
    }

    /* ===== SUBTITLE PARAGRAPHS ===== */
    /* Individual subtitle paragraphs with black background for readability */
    .subtitle p {
        background: #000;
        padding: 10px 40px;
        margin: 8px 0;
        display: inline-block;
    }

    /* ===== AUDIO PLAYER WRAPPER ===== */
    /* Container for the audio player with SEMI-TRANSPARENT BACKGROUND for transparency effect */
    .player-wrapper {
        max-width: 600px;
        height: 110px;
        margin: 20px auto;
        background: rgba(0, 0, 0, 0.4); /* Semi-transparent black allows background to show through */
        padding: 20px;
        border-radius: 8px;
        backdrop-filter: blur(5px); /* Optional: adds subtle blur effect for glass-morphism style */
    }

    /* ===== AUDIO PLAYER ELEMENT ===== */
    /* Styling for the HTML5 audio player with semi-transparent background */
    #episode-player {
        border-radius: 4px;
        width: 100%;
        background: rgba(30, 30, 30, 0.8); /* Dark semi-transparent background for player controls */
    }

    /* ===== EPISODE TITLE TEXT ===== */
    /* Display text for the currently playing episode title */
    #episode-title {
        margin-top: 10px;
        font-size: 0.9rem;
        color: #ccc;
    }

    /* ===== DEBUG INFORMATION ===== */
    /* Display debug/technical information in monospace font */
    .debug-info {
        color: #999;
        font-size: 0.8rem;
        padding: 10px;
        margin-top: 10px;
        background: #111;
        border-radius: 4px;
        font-family: monospace;
        word-break: break-all;
    }

    /* ===== ERROR MESSAGE STYLING ===== */
    /* Display error messages in red for visibility */
    .error-message {
        color: #ff9999;
        font-size: 0.9rem;
        padding: 10px;
        margin-top: 10px;
    }

    /* ===== MOBILE RESPONSIVENESS (Tablets & Larger Mobile Devices) ===== */
    @media (max-width: 768px) {
        /* Allow scrolling on mobile devices */
        body {
            overflow: auto;
        }

        /* Adjust container for mobile scrolling */
        .container {
            height: auto;
            padding: 20px 0;
        }

        /* Reduce title size for smaller screens */
        h1 {
            font-size: 2rem;
            padding: 15px 20px;
            margin-bottom: 15px;
        }

        /* Adjust subtitle font size */
        .subtitle {
            font-size: 0.95rem;
        }

        /* Adjust subtitle paragraph padding */
        .subtitle p {
            padding: 8px 15px;
            margin: 6px 0;
        }

        /* Adjust content area padding */
        .content {
            max-width: 100%;
            padding: 0 15px;
        }

        /* Adjust player wrapper for mobile */
        .player-wrapper {
            max-width: 100%;
            padding: 15px;
            margin: 15px auto;
        }
    }

    /* ===== MOBILE RESPONSIVENESS (Small Phones) ===== */
    @media (max-width: 480px) {
        /* Further reduce title size for small phones */
        h1 {
            font-size: 1.5rem;
            padding: 10px 15px;
        }

        /* Further reduce subtitle font size */
        .subtitle {
            font-size: 0.85rem;
        }

        /* Reduce subtitle paragraph padding on small screens */
        .subtitle p {
            padding: 6px 10px;
        }
    }
        /* ===== COPYRIGHT NOTICE ===== */
/* Small, subtle copyright text fixed to bottom right corner */
.copyright {
    position: fixed;
    bottom: 15px;
    right: 15px;
    font-size: 0.65rem;
    color: #666;
    opacity: 0.5;
    font-family: Arial, sans-serif;
    letter-spacing: 0.02em;
    z-index: 10;
    text-align: right;
    line-height: 1.4;
}

/* ===== COPYRIGHT RESPONSIVENESS ===== */
@media (max-width: 768px) {
    .copyright {
        bottom: 10px;
        right: 10px;
        font-size: 0.6rem;
    }
}

@media (max-width: 480px) {
    .copyright {
        bottom: 8px;
        right: 8px;
        font-size: 0.55rem;
    }
}
    </style>
</head>
<body>
    <!-- Main container that holds all page content -->
    <div class="container">
        <!-- Full-screen background image -->
        <div class="background"></div>

        <!-- Content wrapper for all text and media elements -->
        <div class="content">
            <!-- Main page title -->
            <h1>MIDNIGHT METAL MONASTERY</h1>

            <!-- Tagline/description section -->
            <div class="subtitle">
                <p>We are the Warrior Monks of Christian Rock Radio—slamming the jams that worship the Lamb, servants of the Almighty God.</p>
            </div>

            <!-- Navigation links section -->
            <div class="subtitle">
                <p>
                    <!-- Link to all episodes archive -->
                    <a href="https://archive.org/details/midnight-metal-monastery?sort=-date" target="_blank">All Episodes</a> &#8224;
                    <!-- Link to podcast subscription -->
                    <a href="https://pod.link/1895872625" target="_blank">Subscribe</a> &#8224;
                    <!-- Link to about page -->
                    <a href="https://midmetmon.github.io/midnight-metal-monastery/about.html">About</a> &#8224;
                    <!-- Link to contact email -->
                    <a href="https://midmetmon.github.io/midnight-metal-monastery/connect.html">Connect</a> &#8224;
                    <!-- Link to support page -->
                    <a href="https://midmetmon.github.io/midnight-metal-monastery/support.html">Support</a>
                </p>
            </div>

            <!-- Label for latest episode section -->
            <div class="subtitle">
                <p>Latest Episode:</p>
            </div>

            <!-- Audio player wrapper with SEMI-TRANSPARENT BACKGROUND -->
            <div class="player-wrapper">
                <!-- HTML5 audio player element with controls -->
                <audio id="episode-player" controls>
                    Your browser does not support the audio element.
                </audio>
                <!-- Displays the title of the currently loaded episode -->
                <p id="episode-title"></p>
                <!-- Displays error messages if the episode fails to load -->
                <p id="error-message" class="error-message"></p>
                <!-- Displays debug information for troubleshooting -->
                <!-- <p id="debug-info" class="debug-info"></p> -->
            </div>
            <!-- Copyright notice in bottom right corner -->
            <div class="copyright">© 2024 Midnight Metal Monastery. All rights reserved.
            </div>
        </div>
    </div>

    <!-- JavaScript for loading the latest podcast episode -->
    <script>
    /**
     * Asynchronous function to fetch and load the latest episode from the RSS feed
     * Parses the RSS XML and extracts the audio URL and episode title
     */
    async function loadLatestEpisode() {
        // Get references to error and debug display elements
        const errorEl = document.getElementById('error-message');
       // const debugEl = document.getElementById('debug-info');

        try {
            console.log('Attempting to fetch RSS feed directly from GitHub...');

            // URL to the RSS feed hosted on GitHub
            const rssUrl = 'https://raw.githubusercontent.com/MidMetMon/midnight-metal-monastery/main/podcast.rss';

            // Fetch the RSS feed from the URL
            const response = await fetch(rssUrl);
            if (!response.ok) {
                throw new Error('HTTP ' + response.status);
            }

            // Convert the response to text (XML format)
            const rssText = await response.text();
            console.log('RSS fetched successfully');
            console.log('First 500 chars:', rssText.substring(0, 500));

            // Parse the XML text into a DOM document
            const parser = new DOMParser();
            const xmlDoc = parser.parseFromString(rssText, 'application/xml');

            // Check if XML parsing failed
            if (xmlDoc.getElementsByTagName('parsererror').length > 0) {
                throw new Error('Failed to parse XML');
            }

            // Get all episode items from the RSS feed
            const items = xmlDoc.getElementsByTagName('item');
            console.log('Items found:', items.length);

            // Verify that episodes exist in the feed
            if (items.length === 0) {
                throw new Error('No episodes in feed');
            }

            // Get the first (latest) episode
            const latestItem = items[0];
            const title = latestItem.getElementsByTagName('title')[0]?.textContent || 'Unknown';
            console.log('Title:', title);

            // Get the audio file enclosure (MP3 URL) from the episode
            const enclosure = latestItem.getElementsByTagName('enclosure')[0];
            if (!enclosure) {
                throw new Error('No audio enclosure found');
            }

            // Extract the audio URL from the enclosure
            const mp3Url = enclosure.getAttribute('url');
            console.log('MP3 URL:', mp3Url);
            console.log('Type:', enclosure.getAttribute('type'));

            // Verify that the URL is not empty
            if (!mp3Url) {
                throw new Error('Empty URL in enclosure');
            }

            // Set the audio player source to the episode audio URL
            document.getElementById('episode-player').src = mp3Url;
            // Display the episode title
            document.getElementById('episode-title').textContent = title;
            // Display the audio URL in debug info
            // debugEl.textContent = 'Audio URL: ' + mp3Url;

            console.log('Successfully loaded episode');

        } catch (error) {
            // Log and display any errors that occur during the process
            console.error('ERROR:', error.message);
            errorEl.textContent = 'Error: ' + error.message;
        }
    }

    // Run the loadLatestEpisode function when the page has fully loaded
    document.addEventListener('DOMContentLoaded', loadLatestEpisode);
    </script>
</body>
</html>
