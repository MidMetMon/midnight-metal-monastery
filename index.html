<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Midnight Metal Monastery</title>
    <link href="https://fonts.googleapis.com/css2?family=Special+Elite&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Special Elite', cursive;
            background-color: #000;
            overflow: auto;
        }

        .background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            background-image: url('https://raw.githubusercontent.com/MidMetMon/midnight-metal-monastery/fbbfa54cd344f1b5de62e53fdd4fb626ae86232a/images/The_Catholic_encyclopedia_(Volume_9)%3B_an_international_work_of_reference_on_the_constitution%2C_doctrine%2C_discipline_and_history_of_the_Catholic_Church_(1907)_(14774838801).webp');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            z-index: -1;
        }

        .container {
            position: relative;
            width: 100%;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
            color: #fff;
        }

        header {
            text-align: center;
            padding: 40px 0;
        }

        h1 {
            font-size: 48px;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
        }

        .subtitle {
            font-size: 18px;
            color: #ccc;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.8);
        }

        nav {
            text-align: center;
            margin: 20px 0;
        }

        nav a {
            color: #fff;
            text-decoration: none;
            margin: 0 15px;
            font-size: 14px;
            transition: color 0.3s;
        }

        nav a:hover {
            color: #ccc;
        }

        .player-wrapper {
            background-color: rgba(0, 0, 0, 0.75);
            padding: 30px;
            border-radius: 10px;
            backdrop-filter: blur(5px);
            margin: 20px 0;
        }

        #episode-player {
            width: 100%;
            margin-bottom: 15px;
        }

        #episode-title {
            font-size: 20px;
            margin-top: 15px;
            text-align: center;
        }

        #error-message {
            color: #ff6b6b;
            text-align: center;
            padding: 10px;
        }

        #debug-info {
            font-size: 12px;
            color: #888;
            text-align: center;
            margin-top: 10px;
        }

        footer {
            text-align: center;
            padding: 20px 0;
            font-size: 12px;
            color: #aaa;
        }

        /* Mobile responsiveness */
        @media (max-width: 768px) {
            h1 {
                font-size: 36px;
            }

            .subtitle {
                font-size: 16px;
            }

            nav a {
                display: block;
                margin: 8px 0;
            }

            .container {
                padding: 15px;
            }

            .player-wrapper {
                padding: 20px;
            }
        }

        @media (max-width: 480px) {
            h1 {
                font-size: 28px;
            }

            .subtitle {
                font-size: 14px;
            }

            nav a {
                font-size: 12px;
                margin: 6px 0;
            }

            .container {
                padding: 10px;
            }

            .player-wrapper {
                padding: 15px;
            }

            #episode-title {
                font-size: 16px;
            }
        }
    </style>
</head>
<body>
    <div class="background"></div>

    <div class="container">
        <header>
            <h1>Midnight Metal Monastery</h1>
            <p class="subtitle">A Podcast of Sacred Darkness</p>
        </header>

        <nav>
            <a href="https://archive.org/details/midnight-metal-monastery?sort=-date">All Episodes</a>
            <a href="https://pod.link/1895872625">Subscribe</a>
            <a href="https://midmetmon.github.io/midnight-metal-monastery/about.html">About</a>
            <a href="mailto:contact@midnightmetalmonastery.com">Connect</a>
            <a href="https://midmetmon.github.io/midnight-metal-monastery/support.html">Support</a>
        </nav>

        <div class="player-wrapper">
            <audio id="episode-player" controls>
                <source src="" type="audio/mpeg">
                Your browser does not support the audio element.
            </audio>
            <div id="episode-title"></div>
            <div id="error-message"></div>
            <div id="debug-info"></div>
        </div>

        <footer>
            <p>&copy; 2024 Midnight Metal Monastery. All rights reserved.</p>
        </footer>
    </div>

    <script>
        const RSS_FEED = 'https://raw.githubusercontent.com/MidMetMon/midnight-metal-monastery/main/podcast.rss';

        async function loadLatestEpisode() {
            try {
                const response = await fetch(RSS_FEED);
                const text = await response.text();
                const parser = new DOMParser();
                const xmlDoc = parser.parseFromString(text, 'text/xml');

                if (xmlDoc.getElementsByTagName('parsererror').length) {
                    throw new Error('XML Parse Error');
                }

                const items = xmlDoc.getElementsByTagName('item');
                if (items.length === 0) {
                    throw new Error('No episodes found in RSS feed');
                }

                const latestItem = items[0];
                const title = latestItem.getElementsByTagName('title')[0]?.textContent || 'No Title';
                const audioUrl = latestItem.getElementsByTagName('enclosure')[0]?.getAttribute('url') || '';

                document.getElementById('episode-title').textContent = title;
                document.getElementById('episode-player').src = audioUrl;
                document.getElementById('error-message').textContent = '';

            } catch (error) {
                document.getElementById('error-message').textContent = `Error loading episode: ${error.message}`;
                document.getElementById('debug-info').textContent = `Feed URL: ${RSS_FEED}`;
            }
        }

        loadLatestEpisode();
    </script>
</body>
</html>
