<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Midnight Metal Monastery</title>

    <link href="https://fonts.googleapis.com/css2?family=Special+Elite&display=swap" rel="stylesheet">

    <style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    html, body {
        width: 100%;
        min-height: 100%;
    }

    a {
        color: #ffffff;
        text-decoration: none;
    }

    a:hover {
        text-decoration: underline;
        text-decoration-thickness: 3px;
    }

    body {
        font-family: Arial, sans-serif;
        background: #000;
        color: #fff;
        overflow-x: hidden;
        overflow-y: auto;
    }

    .background {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        background-image: url('https://raw.githubusercontent.com/MidMetMon/midnight-metal-monastery/main/images/1440p_The_Catholic_encyclopedia_(Volume_9)%3B_an_international_work_of_reference_on_the_constitution%2C_doctrine%2C_discipline_and_history_of_the_Catholic_Church_(1907)_(14774838801).webp');
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        z-index: 1;
    }

    .container {
        position: relative;
        width: 100%;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px 0;
    }

    .content {
        position: relative;
        z-index: 3;
        text-align: center;
        max-width: 800px;
        width: 100%;
        padding: 0 15px;
    }

    h1 {
        font-family: 'Special Elite', serif;
        font-size: 3.5rem;
        font-weight: 900;
        letter-spacing: 0.15em;
        margin-bottom: 20px;
        text-transform: uppercase;
        line-height: 1.3;
        background: #000;
        padding: 20px 40px;
        display: inline-block;
    }

    .subtitle {
        font-family: 'Special Elite', serif;
        font-size: 1.3rem;
        font-weight: bold;
        letter-spacing: 0.05em;
        line-height: 1.8;
        text-transform: uppercase;
    }

    .subtitle p {
        background: #000;
        padding: 10px 40px;
        margin: 8px 0;
        display: inline-block;
    }

    .player-wrapper {
        max-width: 600px;
        height: 110px;
        margin: 20px auto;
        background: rgba(0, 0, 0, 1);
        padding: 20px;
        border-radius: 8px;
        backdrop-filter: blur(5px);
    }

    #episode-player {
        border-radius: 4px;
        width: 100%;
        background: rgba(30, 30, 30, 0.8);
    }

    #episode-title {
        margin-top: 10px;
        font-size: 0.9rem;
        color: #ccc;
    }

    .error-message {
        color: #ff9999;
        font-size: 0.9rem;
        padding: 10px;
        margin-top: 10px;
    }

    .copyright {
        position: fixed;
        bottom: 15px;
        right: 15px;
        font-size: 0.65rem;
        color: #666;
        opacity: 0.5;
        font-family: Arial, sans-serif;
        letter-spacing: 0.02em;
        z-index: 10;
        text-align: right;
        line-height: 1.4;
    }

    @media (max-width: 768px) {
        h1 {
            font-size: 2rem;
            padding: 15px 20px;
            margin-bottom: 15px;
        }

        .subtitle {
            font-size: 0.95rem;
        }

        .subtitle p {
            padding: 8px 15px;
            margin: 6px 0;
        }

        .player-wrapper {
            max-width: 100%;
            padding: 15px;
            margin: 15px auto;
        }

        .copyright {
            bottom: 10px;
            right: 10px;
            font-size: 0.6rem;
        }
    }

    @media (max-width: 480px) {
        h1 {
            font-size: 1.5rem;
            padding: 10px 15px;
        }

        .subtitle {
            font-size: 0.85rem;
        }

        .subtitle p {
            padding: 6px 10px;
        }

        .copyright {
            bottom: 8px;
            right: 8px;
            font-size: 0.55rem;
        }
    }
    </style>
</head>
<body>
    <div class="background"></div>

    <div class="container">
        <div class="content">
            <h1>MIDNIGHT METAL MONASTERY</h1>

            <div class="subtitle">
                <p>We are the Warrior Monks of Christian Rock Radio—slamming the jams that worship the Lamb, servants of the Almighty God.</p>
            </div>

            <div class="subtitle">
                <p>
                    <a href="https://archive.org/details/midnight-metal-monastery?sort=-date" target="_blank">All Episodes</a> &#8224;
                    <a href="https://pod.link/1895872625" target="_blank">Subscribe</a> &#8224;
                    <a href="https://midmetmon.github.io/midnight-metal-monastery/about.html">About</a> &#8224;
                    <a href="https://midmetmon.github.io/midnight-metal-monastery/connect.html">Connect</a> &#8224;
                    <a href="https://midmetmon.github.io/midnight-metal-monastery/support.html">Support</a>
                </p>
            </div>

            <div class="subtitle">
                <p>Latest Episode:</p>
            </div>

            <div class="player-wrapper">
                <audio id="episode-player" controls>
                    Your browser does not support the audio element.
                </audio>
                <p id="episode-title"></p>
                <p id="error-message" class="error-message"></p>
            </div>

            <div class="copyright">© 2024 Midnight Metal Monastery. All rights reserved.</div>
        </div>
    </div>

    <script>
    async function loadLatestEpisode() {
        const errorEl = document.getElementById('error-message');

        try {
            const rssUrl = 'https://raw.githubusercontent.com/MidMetMon/midnight-metal-monastery/main/podcast.rss';
            const response = await fetch(rssUrl);

            if (!response.ok) {
                throw new Error('HTTP ' + response.status);
            }

            const rssText = await response.text();
            const parser = new DOMParser();
            const xmlDoc = parser.parseFromString(rssText, 'application/xml');

            if (xmlDoc.getElementsByTagName('parsererror').length > 0) {
                throw new Error('Failed to parse XML');
            }

            const items = xmlDoc.getElementsByTagName('item');

            if (items.length === 0) {
                throw new Error('No episodes in feed');
            }

            const latestItem = items[0];
            const title = latestItem.getElementsByTagName('title')[0]?.textContent || 'Unknown';
            const enclosure = latestItem.getElementsByTagName('enclosure')[0];

            if (!enclosure) {
                throw new Error('No audio enclosure found');
            }

            const mp3Url = enclosure.getAttribute('url');

            if (!mp3Url) {
                throw new Error('Empty URL in enclosure');
            }

            document.getElementById('episode-player').src = mp3Url;
            document.getElementById('episode-title').textContent = title;

        } catch (error) {
            errorEl.textContent = 'Error: ' + error.message;
        }
    }

    document.addEventListener('DOMContentLoaded', loadLatestEpisode);
    </script>
</body>
</html>
